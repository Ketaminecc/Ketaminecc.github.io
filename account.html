<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050609">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.ketaminecc.website https://api.ketaminecc.site https://*.lhr.life https://*.tunnelmole.net; base-uri 'self'; form-action 'self' https://checkout.stripe.com">
  <title>Account — Ketamine.cc</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/assets/logo-icon.png" type="image/png">
  <link rel="apple-touch-icon" href="/assets/logo-icon.png">
  <link rel="stylesheet" href="/assets/styles.css?v=20">
</head>
<body class="page-app app-page">
  <canvas id="snow" aria-hidden="true"></canvas>

  <header class="app-topbar">
    <div class="container header-inner">
      <a class="brand" href="/">
        <span class="brand-mark">
          <img class="brand-logo" src="/assets/logo.png" alt="" width="36" height="34">
          <img class="santa-hat" src="/assets/santa-hat.png" alt="" width="26" height="24">
        </span>
        <span class="brand-name">Ketamine<span>.cc</span></span>
      </a>
      <div class="header-actions">
        <a class="btn btn-ghost btn-small" href="/dashboard.html">Keys</a>
        <a class="btn btn-subtle btn-small" href="/#products">Store</a>
        <button class="btn btn-subtle btn-small" type="button" data-logout>Sign out</button>
      </div>
    </div>
  </header>

  <main class="app-main">
    <div class="app-wrap">
      <div class="page-head">
        <h1>Account.</h1>
        <p data-user-email>—</p>
      </div>

      <div class="account-grid">
        <aside class="account-side">
          <div class="profile-card">
            <div class="profile-avatar" id="profile-avatar">—</div>
            <b data-user-name>—</b>
            <span data-user-email>—</span>
            <div class="profile-meta">
              <div><span>Member since</span><span id="member-since">—</span></div>
              <div><span>Status</span><span style="color:var(--ok)">Active</span></div>
            </div>
          </div>

          <a class="btn btn-primary btn-block" href="/dashboard.html">View license keys</a>

          <div class="panel" style="padding:1rem">
            <a class="btn btn-subtle btn-small btn-block" href="/#questions">Support</a>
          </div>
        </aside>

        <div class="account-main">
          <section class="panel">
            <div class="panel-head">
              <h2>Orders</h2>
              <span class="sub">Last 100</span>
            </div>
            <div class="table-wrap">
              <table class="data-table">
                <thead>
                  <tr>
                    <th>Order</th>
                    <th>Product</th>
                    <th>Amount</th>
                    <th>Status</th>
                    <th>Date</th>
                    <th></th>
                  </tr>
                </thead>
                <tbody id="orders-body">
                  <tr><td colspan="6" class="table-empty">Loading…</td></tr>
                </tbody>
              </table>
            </div>
          </section>

          <section class="panel">
            <div class="panel-head">
              <h2>Password</h2>
              <span class="sub">Security</span>
            </div>
            <div class="form-error" id="password-error" role="alert"></div>
            <form id="password-form">
              <div class="field-row">
                <div class="field">
                  <label for="current-password">Current</label>
                  <input class="input" id="current-password" type="password" autocomplete="current-password" required>
                </div>
                <div class="field">
                  <label for="new-password">New</label>
                  <input class="input" id="new-password" type="password" autocomplete="new-password" minlength="8" required>
                </div>
              </div>
              <div class="field">
                <label for="confirm-password">Confirm new</label>
                <input class="input" id="confirm-password" type="password" autocomplete="new-password" minlength="8" required>
              </div>
              <div style="display:flex;justify-content:flex-end">
                <button class="btn btn-ghost" type="submit" id="password-submit">Update password</button>
              </div>
            </form>
          </section>
        </div>
      </div>
    </div>
  </main>

  <script src="/assets/config.js?v=20"></script>
  <script src="/assets/app.js?v=20"></script>
  <script src="/assets/account.js?v=20"></script>
</body>
</html>
