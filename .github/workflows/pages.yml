name: Deploy static site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Stage static files
        run: |
          mkdir -p _site
          cp *.html _site/
          cp -r assets _site/assets
          cp CNAME .nojekyll robots.txt _site/
          # Build zips live under server/builds for the API host only. They are
          # deliberately not staged: Pages must never serve a downloadable zip.

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  # deploy-pages looks up the "github-pages" artifact of the run, so the upload
  # has to happen in its own job that this one depends on.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
