<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050609">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.ketaminecc.website https://api.ketaminecc.site https://*.lhr.life; base-uri 'self'; form-action 'self' https://checkout.stripe.com">
  <title>Sign in — Ketamine.cc</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/assets/logo-icon.png" type="image/png">
  <link rel="apple-touch-icon" href="/assets/logo-icon.png">
  <link rel="stylesheet" href="/assets/styles.css?v=14">
</head>
<body class="page-app app-page">
  <canvas id="snow" aria-hidden="true"></canvas>

  <header class="app-topbar">
    <div class="container header-inner">
      <a class="brand" href="/">
        <span class="brand-mark">
          <img class="brand-logo" src="/assets/logo.png" alt="" width="36" height="34">
          <img class="santa-hat" src="/assets/santa-hat.png" alt="" width="26" height="24">
        </span>
        <span class="brand-name">Ketamine<span>.cc</span></span>
        <span class="brand-meta">ACCOUNT</span>
      </a>
      <div class="header-actions">
        <a class="btn btn-ghost btn-small" href="/">Back to store</a>
      </div>
    </div>
  </header>

  <main class="app-main">
    <div class="app-wrap">
      <div class="auth-layout">
        <aside class="auth-aside">
          <div class="eyebrow"><span class="dot"></span> Account</div>
          <h1>One account.<br>Every key.</h1>
          <p>Sign in to buy, view keys, and check expiration dates.</p>
        </aside>

        <section class="auth-card">
          <div class="tabs" role="tablist" aria-label="Authentication mode">
            <button class="tab" type="button" role="tab" id="tab-login" aria-selected="true" aria-controls="auth-form">Sign in</button>
            <button class="tab" type="button" role="tab" id="tab-register" aria-selected="false" aria-controls="auth-form">Create account</button>
          </div>

          <h2 id="auth-title">Welcome back</h2>
          <p class="sub" id="auth-sub">Sign in to manage licenses and complete checkout.</p>

          <div class="form-error" id="auth-error" role="alert"></div>

          <form id="auth-form" novalidate>
            <div class="field" id="name-field" hidden>
              <label for="auth-name">Display name <span class="dim">(optional)</span></label>
              <input class="input" id="auth-name" name="name" type="text" autocomplete="nickname" maxlength="60" placeholder="How we address you">
            </div>

            <div class="field">
              <label for="auth-email">Email</label>
              <input class="input" id="auth-email" name="email" type="email" autocomplete="email" required placeholder="you@example.com">
            </div>

            <div class="field">
              <label for="auth-password">Password</label>
              <input class="input" id="auth-password" name="password" type="password" autocomplete="current-password" required minlength="8" placeholder="At least 8 characters">
            </div>

            <div class="field" id="confirm-field" hidden>
              <label for="auth-confirm">Confirm password</label>
              <input class="input" id="auth-confirm" name="confirm" type="password" autocomplete="new-password" minlength="8" placeholder="Repeat your password">
            </div>

            <button class="btn btn-primary btn-block" type="submit" id="auth-submit">Sign in</button>
          </form>

          <p class="switch-note" id="auth-switch">New here? <button type="button" class="link" id="switch-btn" style="background:none;border:0;padding:0;border-bottom:1px solid currentColor">Create an account</button></p>
          <p class="form-note" style="text-align:center;margin-top:1rem">
            By continuing you agree to the refund policy. Need help? <a class="link" href="/#questions">Read the FAQ</a>.
          </p>
        </section>
      </div>
    </div>
  </main>

  <script src="/assets/config.js?v=14"></script>
  <script src="/assets/app.js?v=14"></script>
  <script src="/assets/auth.js?v=14"></script>
</body>
</html>
